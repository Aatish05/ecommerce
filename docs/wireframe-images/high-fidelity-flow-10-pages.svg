<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">High-fidelity 10 page website flow</title>
  <desc id="desc">Styled high-fidelity flow showing ten pages for the EcoTech Electronics e-commerce project.</desc>
  <defs>
    <linearGradient id="greenHero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fff9"/>
      <stop offset="1" stop-color="#dff7e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#198754"/>
    </marker>
    <style>
      .page{fill:#fff;stroke:#dfe7e2;stroke-width:2;filter:url(#shadow)}
      .nav{fill:#10231b}
      .green{fill:#198754}
      .soft{fill:#e9f7ef}
      .muted{fill:#f1f4f3}
      .blue{fill:#0d6efd}
      .yellow{fill:#ffc107}
      .txt{font-family:Arial,sans-serif;fill:#10231b}
      .white{fill:#fff}
      .small{font-size:12px}
      .title{font-size:18px;font-weight:700}
      .arrow{stroke:#198754;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1250" fill="#f7f9fb"/>
  <text x="60" y="65" class="txt" font-size="34" font-weight="700">EcoTech Electronics - High-Fidelity 10 Page Flow</text>
  <text x="60" y="100" class="txt" font-size="18" fill="#53615a">Styled academic wireframe: Bootstrap cards, green theme, dashboard statistics, and role-based user flow.</text>

  <g transform="translate(60 150)">
    <rect class="page" width="300" height="210" rx="16"/>
    <rect class="nav" width="300" height="34" rx="16"/>
    <text x="16" y="23" class="white" font-family="Arial,sans-serif" font-size="13" font-weight="700">EcoTech</text>
    <text x="95" y="23" class="white" font-family="Arial,sans-serif" font-size="10">Home Shop Cart Login</text>
    <rect x="16" y="55" width="268" height="70" rx="14" fill="url(#greenHero)"/>
    <text x="32" y="82" class="txt title">1. Homepage</text>
    <text x="32" y="105" class="txt small">Hero banner + CTA buttons</text>
    <rect x="32" y="112" width="70" height="18" rx="9" class="green"/>
    <text x="48" y="126" class="white" font-family="Arial,sans-serif" font-size="9">Shop</text>
    <rect x="16" y="145" width="78" height="42" rx="10" class="soft"/>
    <rect x="111" y="145" width="78" height="42" rx="10" class="soft"/>
    <rect x="206" y="145" width="78" height="42" rx="10" class="soft"/>
  </g>

  <g transform="translate(420 150)">
    <rect class="page" width="300" height="210" rx="16"/>
    <text x="16" y="30" class="txt title">2. Products</text>
    <rect x="16" y="45" width="268" height="32" rx="12" class="muted"/>
    <text x="32" y="66" class="txt small">Search | Filter | Sort</text>
    <rect x="218" y="52" width="50" height="18" rx="9" class="green"/>
    <g transform="translate(16 95)">
      <rect width="78" height="88" rx="12" class="soft"/>
      <text x="16" y="55" class="txt small">Laptop</text>
      <text x="16" y="73" font-family="Arial,sans-serif" font-size="11" fill="#198754">$899</text>
    </g>
    <g transform="translate(111 95)">
      <rect width="78" height="88" rx="12" class="soft"/>
      <text x="16" y="55" class="txt small">Phone</text>
      <text x="16" y="73" font-family="Arial,sans-serif" font-size="11" fill="#198754">$699</text>
    </g>
    <g transform="translate(206 95)">
      <rect width="78" height="88" rx="12" class="soft"/>
      <text x="16" y="55" class="txt small">Audio</text>
      <text x="16" y="73" font-family="Arial,sans-serif" font-size="11" fill="#198754">$159</text>
    </g>
  </g>

  <g transform="translate(780 150)">
    <rect class="page" width="300" height="210" rx="16"/>
    <text x="16" y="30" class="txt title">3. Product Detail</text>
    <rect x="16" y="55" width="105" height="95" rx="12" class="soft"/>
    <text x="48" y="107" class="txt small">Image</text>
    <rect x="140" y="55" width="70" height="18" rx="9" class="green"/>
    <text x="153" y="68" class="white" font-family="Arial,sans-serif" font-size="9">Category</text>
    <text x="140" y="98" class="txt" font-size="15" font-weight="700">Product Name</text>
    <text x="140" y="122" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#198754">$899.00</text>
    <rect x="140" y="138" width="140" height="22" rx="11" class="green"/>
    <text x="184" y="153" class="white" font-family="Arial,sans-serif" font-size="10">Add to cart</text>
    <rect x="16" y="175" width="268" height="20" rx="10" class="muted"/>
  </g>

  <g transform="translate(1140 150)">
    <rect class="page" width="300" height="210" rx="16"/>
    <text x="16" y="30" class="txt title">4. Cart</text>
    <rect x="16" y="50" width="268" height="26" rx="8" class="muted"/>
    <rect x="16" y="88" width="268" height="28" rx="8" class="soft"/>
    <rect x="16" y="126" width="268" height="28" rx="8" class="soft"/>
    <text x="178" y="174" class="txt small">Total: $</text>
    <rect x="190" y="182" width="94" height="20" rx="10" class="green"/>
    <text x="215" y="196" class="white" font-family="Arial,sans-serif" font-size="9">Checkout</text>
  </g>

  <g transform="translate(1500 150)">
    <rect class="page" width="240" height="210" rx="16"/>
    <text x="16" y="30" class="txt title">5. Checkout</text>
    <rect x="16" y="55" width="130" height="24" rx="8" class="muted"/>
    <rect x="16" y="90" width="130" height="60" rx="8" class="muted"/>
    <rect x="160" y="55" width="64" height="95" rx="10" class="soft"/>
    <rect x="16" y="170" width="208" height="25" rx="12" class="green"/>
    <text x="84" y="187" class="white" font-family="Arial,sans-serif" font-size="10">Place Order</text>
  </g>

  <g transform="translate(60 460)">
    <rect class="page" width="300" height="210" rx="16"/>
    <text x="16" y="30" class="txt title">6. Login / Register</text>
    <rect x="30" y="60" width="240" height="24" rx="10" class="muted"/>
    <rect x="30" y="98" width="240" height="24" rx="10" class="muted"/>
    <rect x="30" y="136" width="240" height="24" rx="10" class="muted"/>
    <rect x="30" y="174" width="240" height="24" rx="12" class="green"/>
  </g>

  <g transform="translate(420 460)">
    <rect class="page" width="300" height="210" rx="16"/>
    <text x="16" y="30" class="txt title">7. User Orders</text>
    <rect x="16" y="55" width="268" height="28" rx="8" class="muted"/>
    <rect x="16" y="95" width="268" height="28" rx="8" class="soft"/>
    <rect x="16" y="135" width="268" height="28" rx="8" class="soft"/>
    <rect x="16" y="175" width="100" height="20" rx="10" class="green"/>
  </g>

  <g transform="translate(780 460)">
    <rect class="page" width="300" height="210" rx="16"/>
    <rect width="68" height="210" rx="16" class="nav"/>
    <text x="14" y="42" class="white" font-family="Arial,sans-serif" font-size="11">Admin</text>
    <text x="90" y="30" class="txt title">8. Admin</text>
    <rect x="90" y="50" width="50" height="28" rx="8" class="nav"/>
    <rect x="150" y="50" width="50" height="28" rx="8" class="blue"/>
    <rect x="210" y="50" width="50" height="28" rx="8" class="green"/>
    <rect x="90" y="95" width="170" height="45" rx="10" class="soft"/>
    <polyline points="105,128 135,112 165,120 195,104 240,110" fill="none" stroke="#198754" stroke-width="3"/>
    <rect x="90" y="155" width="170" height="35" rx="8" class="muted"/>
  </g>

  <g transform="translate(1140 460)">
    <rect class="page" width="300" height="210" rx="16"/>
    <text x="16" y="30" class="txt title">9. Admin Products</text>
    <rect x="16" y="55" width="120" height="24" rx="12" class="green"/>
    <text x="42" y="72" class="white" font-family="Arial,sans-serif" font-size="10">Add product</text>
    <rect x="16" y="95" width="268" height="26" rx="8" class="soft"/>
    <rect x="16" y="130" width="268" height="26" rx="8" class="soft"/>
    <rect x="16" y="165" width="268" height="26" rx="8" class="soft"/>
  </g>

  <g transform="translate(1500 460)">
    <rect class="page" width="240" height="210" rx="16"/>
    <rect width="55" height="210" rx="16" class="nav"/>
    <text x="11" y="42" class="white" font-family="Arial,sans-serif" font-size="10">Vendor</text>
    <text x="74" y="30" class="txt title">10. Vendor</text>
    <rect x="74" y="50" width="145" height="28" rx="8" class="nav"/>
    <rect x="74" y="92" width="145" height="45" rx="10" class="soft"/>
    <rect x="92" y="114" width="18" height="18" class="green"/>
    <rect x="124" y="104" width="18" height="28" class="green"/>
    <rect x="156" y="110" width="18" height="22" class="green"/>
    <rect x="74" y="155" width="145" height="35" rx="8" class="muted"/>
  </g>

  <path class="arrow" d="M360 255 H420"/>
  <path class="arrow" d="M720 255 H780"/>
  <path class="arrow" d="M1080 255 H1140"/>
  <path class="arrow" d="M1440 255 H1500"/>
  <path class="arrow" d="M210 360 V460"/>
  <path class="arrow" d="M360 565 H420"/>
  <path class="arrow" d="M720 565 H780"/>
  <path class="arrow" d="M1080 565 H1140"/>
  <path class="arrow" d="M1440 565 H1500"/>

  <g transform="translate(60 780)">
    <rect width="1680" height="300" rx="18" fill="#ffffff" stroke="#dfe7e2" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="40" class="txt title">High-Fidelity Flow Explanation</text>
    <text x="25" y="78" class="txt" font-size="17">Customer journey: browse products, view details/reviews, add to cart, checkout, and view order history.</text>
    <text x="25" y="118" class="txt" font-size="17">Admin journey: view revenue dashboard, sales graph, order history, product details, users, and reviews.</text>
    <text x="25" y="158" class="txt" font-size="17">Vendor journey: log in as a seller, add products, view own orders, and track own revenue.</text>
    <text x="25" y="198" class="txt" font-size="17">Design style: green sustainability theme, Bootstrap cards, sticky navigation, rounded buttons, clear tables, and dashboard graphs.</text>
    <text x="25" y="238" class="txt" font-size="17">This is high fidelity because it shows final colours, hierarchy, card design, buttons, and dashboard appearance.</text>
  </g>
</svg>
