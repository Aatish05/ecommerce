<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">High-fidelity wireframe for EcoTech Electronics</title>
  <desc id="desc">A styled high-fidelity wireframe showing the final green themed e-commerce interface and dashboards.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fff9"/>
      <stop offset="1" stop-color="#e9f7ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="#f7f9fb"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#10231b">EcoTech Electronics - High-Fidelity Wireframes</text>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="18" fill="#53615a">Styled design direction: colour, spacing, cards, buttons, and dashboard components.</text>

  <g transform="translate(60 145)" filter="url(#shadow)">
    <rect width="390" height="310" rx="18" fill="#ffffff"/>
    <rect width="390" height="42" rx="18" fill="#ffffff"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#198754">EcoTech</text>
    <text x="110" y="28" font-family="Arial, sans-serif" font-size="12" fill="#10231b">Home  Shop  Contact  Cart</text>
    <rect x="20" y="65" width="350" height="100" rx="16" fill="url(#hero)" stroke="#d7efe2"/>
    <text x="42" y="98" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#10231b">Sustainable Electronics</text>
    <text x="42" y="124" font-family="Arial, sans-serif" font-size="13" fill="#53615a">Modern devices with secure shopping</text>
    <rect x="42" y="138" width="85" height="22" rx="11" fill="#198754"/>
    <text x="58" y="154" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Shop Now</text>
    <rect x="20" y="185" width="105" height="55" rx="12" fill="#e9f7ef"/>
    <rect x="142" y="185" width="105" height="55" rx="12" fill="#e9f7ef"/>
    <rect x="265" y="185" width="105" height="55" rx="12" fill="#e9f7ef"/>
    <text x="46" y="218" font-family="Arial, sans-serif" font-size="12" fill="#10231b">Secure</text>
    <text x="165" y="218" font-family="Arial, sans-serif" font-size="12" fill="#10231b">Dynamic</text>
    <text x="292" y="218" font-family="Arial, sans-serif" font-size="12" fill="#10231b">Mobile</text>
    <rect x="20" y="260" width="350" height="30" rx="10" fill="#10231b"/>
    <text x="145" y="280" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Footer links</text>
  </g>

  <g transform="translate(505 145)" filter="url(#shadow)">
    <rect width="390" height="310" rx="18" fill="#ffffff"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#10231b">Shop Electronics</text>
    <rect x="20" y="55" width="350" height="42" rx="12" fill="#f1f4f3" stroke="#dbe4df"/>
    <text x="42" y="81" font-family="Arial, sans-serif" font-size="12" fill="#53615a">Search | Category | Sort</text>
    <rect x="288" y="64" width="65" height="24" rx="12" fill="#198754"/>
    <text x="306" y="81" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Filter</text>
    <g transform="translate(20 115)">
