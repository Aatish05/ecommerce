    <text x="65" y="140" font-family="Arial, sans-serif" font-size="14" fill="#198754">Image</text>
    <rect x="195" y="60" width="65" height="22" rx="11" fill="#198754"/>
    <text x="213" y="76" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Laptop</text>
    <text x="195" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10231b">EcoBook Air</text>
    <text x="195" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#198754">$899.00</text>
    <rect x="195" y="160" width="175" height="38" rx="8" fill="#f1f4f3"/>
