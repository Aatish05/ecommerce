    <text x="28" y="82" font-family="Arial, sans-serif" font-size="13" fill="#dce8e2">Dashboard</text>
    <text x="28" y="112" font-family="Arial, sans-serif" font-size="13" fill="#dce8e2">Products</text>
    <text x="28" y="142" font-family="Arial, sans-serif" font-size="13" fill="#dce8e2">Orders</text>
    <text x="28" y="172" font-family="Arial, sans-serif" font-size="13" fill="#dce8e2">Reviews</text>
    <text x="175" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#10231b">Admin Dashboard</text>
    <rect x="175" y="65" width="95" height="52" rx="12" fill="#10231b"/>
    <rect x="285" y="65" width="95" height="52" rx="12" fill="#0d6efd"/>
    <rect x="395" y="65" width="95" height="52" rx="12" fill="#198754"/>
    <rect x="500" y="65" width="75" height="52" rx="12" fill="#ffc107"/>
    <text x="190" y="96" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Revenue</text>
    <rect x="175" y="140" width="400" height="75" rx="14" fill="#e9f7ef"/>
    <polyline points="200,190 260,175 320,185 380,155 440,165 520,145" fill="none" stroke="#198754" stroke-width="4"/>
    <text x="325" y="238" font-family="Arial, sans-serif" font-size="13" fill="#53615a">Sales graph</text>
    <rect x="175" y="250" width="400" height="38" rx="10" fill="#f1f4f3"/>
    <text x="310" y="274" font-family="Arial, sans-serif" font-size="13" fill="#53615a">Order history table</text>
  </g>

  <g transform="translate(725 515)" filter="url(#shadow)">
    <rect width="615" height="310" rx="18" fill="#ffffff"/>
    <rect x="0" y="0" width="145" height="310" rx="18" fill="#10231b"/>
    <text x="28" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Vendor</text>
    <text x="28" y="82" font-family="Arial, sans-serif" font-size="13" fill="#dce8e2">Dashboard</text>
    <text x="28" y="112" font-family="Arial, sans-serif" font-size="13" fill="#dce8e2">My Products</text>
    <text x="28" y="142" font-family="Arial, sans-serif" font-size="13" fill="#dce8e2">Orders</text>
    <text x="175" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#10231b">Vendor Dashboard</text>
    <rect x="175" y="65" width="125" height="52" rx="12" fill="#10231b"/>
    <rect x="315" y="65" width="125" height="52" rx="12" fill="#0d6efd"/>
    <rect x="455" y="65" width="120" height="52" rx="12" fill="#198754"/>
    <text x="195" y="96" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">My Revenue</text>
    <rect x="175" y="140" width="400" height="75" rx="14" fill="#e9f7ef"/>
    <rect x="205" y="177" width="30" height="28" fill="#198754"/>
    <rect x="260" y="160" width="30" height="45" fill="#198754"/>
    <rect x="315" y="170" width="30" height="35" fill="#198754"/>
    <rect x="370" y="150" width="30" height="55" fill="#198754"/>
    <rect x="425" y="158" width="30" height="47" fill="#198754"/>
    <text x="320" y="238" font-family="Arial, sans-serif" font-size="13" fill="#53615a">Vendor sales graph</text>
    <rect x="175" y="250" width="400" height="38" rx="10" fill="#f1f4f3"/>
    <text x="305" y="274" font-family="Arial, sans-serif" font-size="13" fill="#53615a">My products and orders</text>
