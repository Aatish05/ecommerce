      <rect x="12" y="12" width="81" height="60" rx="8" fill="#e9f7ef"/>
      <text x="18" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#10231b">Laptop</text>
      <text x="18" y="112" font-family="Arial, sans-serif" font-size="12" fill="#198754">$899</text>
      <rect x="18" y="130" width="70" height="22" rx="11" fill="#198754"/>
      <text x="34" y="146" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Add</text>
    </g>
    <g transform="translate(142 115)">
      <rect width="105" height="165" rx="14" fill="#ffffff" stroke="#e1e7e4"/>
      <rect x="12" y="12" width="81" height="60" rx="8" fill="#e9f7ef"/>
      <text x="18" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#10231b">Phone</text>
      <text x="18" y="112" font-family="Arial, sans-serif" font-size="12" fill="#198754">$699</text>
      <rect x="18" y="130" width="70" height="22" rx="11" fill="#198754"/>
      <text x="34" y="146" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Add</text>
    </g>
    <g transform="translate(265 115)">
      <rect width="105" height="165" rx="14" fill="#ffffff" stroke="#e1e7e4"/>
      <rect x="12" y="12" width="81" height="60" rx="8" fill="#e9f7ef"/>
      <text x="18" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#10231b">Audio</text>
      <text x="18" y="112" font-family="Arial, sans-serif" font-size="12" fill="#198754">$159</text>
      <rect x="18" y="130" width="70" height="22" rx="11" fill="#198754"/>
      <text x="34" y="146" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Add</text>
    </g>
  </g>

  <g transform="translate(950 145)" filter="url(#shadow)">
