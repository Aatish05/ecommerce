    <rect x="175" y="60" width="95" height="50" fill="#ececec" stroke="#555"/>
    <rect x="285" y="60" width="95" height="50" fill="#ececec" stroke="#555"/>
    <rect x="395" y="60" width="95" height="50" fill="#ececec" stroke="#555"/>
    <rect x="500" y="60" width="75" height="50" fill="#ececec" stroke="#555"/>
    <text x="194" y="90" font-family="Arial, sans-serif" font-size="13" fill="#333">Revenue</text>
    <rect x="175" y="130" width="400" height="75" fill="#ececec" stroke="#555"/>
    <text x="330" y="172" font-family="Arial, sans-serif" font-size="14" fill="#333">Sales Graph</text>
    <rect x="175" y="225" width="400" height="65" fill="#ececec" stroke="#555"/>
    <text x="320" y="262" font-family="Arial, sans-serif" font-size="14" fill="#333">Order Table</text>
  </g>

  <g transform="translate(725 515)">
    <rect width="615" height="310" rx="10" fill="#fff" stroke="#222" stroke-width="3"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222">Vendor Dashboard</text>
    <rect x="20" y="60" width="130" height="230" fill="#e6e6e6" stroke="#555"/>
    <text x="48" y="180" font-family="Arial, sans-serif" font-size="14" fill="#333">Sidebar</text>
    <rect x="175" y="60" width="125" height="50" fill="#ececec" stroke="#555"/>
    <rect x="315" y="60" width="125" height="50" fill="#ececec" stroke="#555"/>
    <rect x="455" y="60" width="120" height="50" fill="#ececec" stroke="#555"/>
    <text x="195" y="90" font-family="Arial, sans-serif" font-size="13" fill="#333">My Revenue</text>
    <rect x="175" y="130" width="400" height="75" fill="#ececec" stroke="#555"/>
    <text x="330" y="172" font-family="Arial, sans-serif" font-size="14" fill="#333">Sales Graph</text>
    <rect x="175" y="225" width="400" height="65" fill="#ececec" stroke="#555"/>
    <text x="315" y="262" font-family="Arial, sans-serif" font-size="14" fill="#333">My Products / Orders</text>
