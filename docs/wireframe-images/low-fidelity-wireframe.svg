<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Low-fidelity wireframe for EcoTech Electronics</title>
  <desc id="desc">A simple grey box wireframe showing homepage, products page, product detail page, admin dashboard, and vendor dashboard layouts.</desc>
  <rect width="1400" height="900" fill="#f4f4f4"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#222">EcoTech Electronics - Low-Fidelity Wireframes</text>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="18" fill="#555">Basic layout planning only: boxes, labels, and content placement.</text>

  <g transform="translate(60 145)">
    <rect width="390" height="310" rx="10" fill="#fff" stroke="#222" stroke-width="3"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222">Homepage</text>
    <rect x="20" y="55" width="350" height="30" fill="#d9d9d9" stroke="#555"/>
    <text x="35" y="76" font-family="Arial, sans-serif" font-size="14" fill="#333">Logo | Home | Shop | Contact | Cart</text>
    <rect x="20" y="105" width="350" height="80" fill="#ececec" stroke="#555"/>
    <text x="135" y="150" font-family="Arial, sans-serif" font-size="16" fill="#333">Hero Section</text>
    <rect x="20" y="205" width="105" height="55" fill="#ececec" stroke="#555"/>
    <rect x="142" y="205" width="105" height="55" fill="#ececec" stroke="#555"/>
    <rect x="265" y="205" width="105" height="55" fill="#ececec" stroke="#555"/>
    <text x="43" y="238" font-family="Arial, sans-serif" font-size="13" fill="#333">Feature</text>
    <text x="165" y="238" font-family="Arial, sans-serif" font-size="13" fill="#333">Feature</text>
    <text x="288" y="238" font-family="Arial, sans-serif" font-size="13" fill="#333">Feature</text>
    <rect x="20" y="275" width="350" height="20" fill="#d9d9d9" stroke="#555"/>
    <text x="160" y="290" font-family="Arial, sans-serif" font-size="12" fill="#333">Footer</text>
  </g>

  <g transform="translate(505 145)">
    <rect width="390" height="310" rx="10" fill="#fff" stroke="#222" stroke-width="3"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222">Products Page</text>
    <rect x="20" y="55" width="350" height="30" fill="#d9d9d9" stroke="#555"/>
    <text x="45" y="76" font-family="Arial, sans-serif" font-size="14" fill="#333">Search | Category | Sort | Button</text>
    <rect x="20" y="105" width="105" height="155" fill="#ececec" stroke="#555"/>
    <rect x="142" y="105" width="105" height="155" fill="#ececec" stroke="#555"/>
    <rect x="265" y="105" width="105" height="155" fill="#ececec" stroke="#555"/>
    <text x="38" y="182" font-family="Arial, sans-serif" font-size="13" fill="#333">Product</text>
    <text x="160" y="182" font-family="Arial, sans-serif" font-size="13" fill="#333">Product</text>
    <text x="283" y="182" font-family="Arial, sans-serif" font-size="13" fill="#333">Product</text>
    <rect x="20" y="275" width="350" height="20" fill="#d9d9d9" stroke="#555"/>
  </g>

  <g transform="translate(950 145)">
    <rect width="390" height="310" rx="10" fill="#fff" stroke="#222" stroke-width="3"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222">Product Detail</text>
